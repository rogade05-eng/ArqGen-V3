[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "arqgen_core"
version = "3.49.0"
description = "Acelerador Rust de ARQ GEN (FASE B): geometria de encaje + XLSX nativo"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.maturin]
module-name = "arqgen_core"
features = ["pyo3/extension-module"]
