[package]
name = "arqgen_core"
version = "3.49.0"
edition = "2021"
description = "Acelerador Rust de ARQ GEN (FASE B): geometria de encaje + XLSX nativo"
license = "MIT"

[lib]
name = "arqgen_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
