[package]
name = "arq-gen"
version = "3.48.0"
description = "ARQ GEN - generador de arquitectura (shell Tauri, Fase A)"
authors = ["rogade05-eng"]
edition = "2021"
rust-version = "1.77"

# El binario se llama ARQ_GEN para que el instalador NSIS produzca
# ARQ_GEN.exe (igual que el pipeline clasico de 03_COMPILAR.bat).
[[bin]]
name = "ARQ_GEN"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
