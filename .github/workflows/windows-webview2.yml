# The native test is deliberately NOT the Chromium/Linux suite. It launches the
# Tauri debug .exe through tauri-driver/msedgedriver and fails without WebView2.
# After the smoke it compiles and ZIPs the REAL release .exe (unsigned prototype).
# Requires Actions access to this repository. Runs have been observed through the
# checks API; native WebView2 has NOT passed yet (failures stop before the smoke).
name: Windows Tauri / WebView2 native QA

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0da1c-arqgen-v3]
    paths:
      - .github/workflows/windows-webview2.yml
      - Cargo.toml
      - Cargo.lock
      - core/**
      - examples/**
      - knowledge/**
      - scripts/**
      - web/**

permissions:
  contents: read

jobs:
  native-webview2:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Versions and reproducible web dependencies
        shell: pwsh
        run: |
          Write-Host "Windows $([System.Environment]::OSVersion.VersionString)"
          rustc --version
          cargo --version
          node --version
          npm --version
          npm ci --prefix web
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
      # Logs of this repository's runs are not always retrievable from every
      # environment; every gate therefore republishes the failing tail as an
      # ::error:: annotation so the cause is visible through the checks API.
      - name: Core and web regression gates (NOT native QA)
        shell: pwsh
        run: |
          $gates = @(
            @{ name = 'cargo fmt --all -- --check'; file = 'cargo'; args = @('fmt', '--all', '--', '--check') },
            @{ name = 'cargo test --locked --workspace'; file = 'cargo'; args = @('test', '--locked', '--workspace') },
            @{ name = 'npm test --prefix web'; file = 'npm'; args = @('test', '--prefix', 'web') }
          )
          $failure = $null
          foreach ($gate in $gates) {
            Write-Host "::group::gate $($gate.name)"
            $log = Join-Path $env:RUNNER_TEMP ("gate-" + [Guid]::NewGuid().ToString('N') + '.log')
            & $gate.file @($gate.args) 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($code -ne 0) {
              $escape = { param($text) ($text -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A') }
              $lines = @(Get-Content -LiteralPath $log)
              $index = ($lines | Select-String -Pattern '^\s*not ok \d+ - ' | Select-Object -First 1)
              if ($index) {
                $start = [Math]::Max(0, $index.LineNumber - 1)
                $stop = [Math]::Min($lines.Count - 1, $start + 45)
                $block = ($lines[$start..$stop] | ForEach-Object { $_.Trim() }) -join "`n"
                if ($block.Length -gt 4000) { $block = $block.Substring(0, 4000) }
                Write-Host "::error title=Failing test detail::$(& $escape $block)"
              }
              $details = (Select-String -LiteralPath $log -Pattern '^not ok |^\s*(error|operator|code):' |
                Select-Object -First 25 | ForEach-Object { $_.Line.Trim() }) -join "`n"
              if ($details.Length -gt 2500) { $details = $details.Substring(0, 2500) }
              if ($details) { Write-Host "::error title=Failures in $($gate.name)::$(& $escape $details)" }
              $tail = (Get-Content -LiteralPath $log -Tail 25) -join "`n"
              $tail = & $escape $tail
              if ($tail.Length -gt 3000) { $tail = $tail.Substring($tail.Length - 3000) }
              Write-Host "::error title=Gate failed ($($gate.name)) exit $code::$tail"
              $failure = $gate.name
              break
            }
          }
          if ($failure) { throw "Regression gate failed: $failure (tail published as annotation)" }
      - name: Build the actual Windows Tauri app (debug, no installer)
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/run-with-annotation.ps1'
          # Separado del CLI de Tauri para atribuir el fallo: compuerta web y
          # compilación Rust del shell no deben confundirse en los diagnósticos.
          & $script -Name 'windows-web-build' -TailLines 40 -Command 'npm run build --prefix web'
          if ($LASTEXITCODE -ne 0) { throw 'Offline web build failed' }
          # Publica la versión del CLI: si el binario Windows de @tauri-apps/cli
          # no existiera, el fallo se vería aquí antes del build.
          & $script -Name 'windows-tauri-cli-version' -Command 'npm run tauri --prefix web -- --version'
          & $script -Name 'windows-tauri-debug-build' -TailLines 40 -Command 'npm run tauri --prefix web -- build --debug --no-bundle --verbose'
          if ($LASTEXITCODE -ne 0) { throw 'Windows Tauri build failed' }
          $app = Join-Path $env:GITHUB_WORKSPACE 'web/src-tauri/target/debug/arqgen-desktop.exe'
          if (!(Test-Path $app)) { throw "Missing Tauri executable: $app" }
          Get-FileHash $app -Algorithm SHA256 | Format-List
          "ARQGEN_TAURI_BINARY=$app" >> $env:GITHUB_ENV
      - name: Install native WebView2 drivers (no plugin/IPC in app)
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/run-with-annotation.ps1'
          try {
            & $script -Name 'tauri-driver-install' -Command 'cargo install tauri-driver --version 2.0.6 --locked'
            if ($LASTEXITCODE -ne 0) { throw 'tauri-driver installation failed' }
            & $script -Name 'tauri-driver-version' -Command 'tauri-driver --version'
            if ($LASTEXITCODE -ne 0) { throw 'tauri-driver is not executable' }
            # Pinned source; at runtime this tool downloads the driver
            # matching the installed *WebView2 runtime* from Microsoft's server.
            & $script -Name 'msedgedriver-tool-install' -Command 'cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked'
            if ($LASTEXITCODE -ne 0) { throw 'msedgedriver-tool installation failed' }
            $folder = Join-Path $env:RUNNER_TEMP 'arqgen-edge-driver'
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Push-Location $folder
            try {
              & $script -Name 'msedgedriver-download' -Command 'msedgedriver-tool'
              if ($LASTEXITCODE -ne 0) { throw 'No compatible WebView2 driver was downloaded' }
              $edge = Join-Path $folder 'msedgedriver.exe'
              if (!(Test-Path $edge)) { throw "Missing EdgeDriver: $edge" }
              & $script -Name 'msedgedriver-version' -Command ('"{0}" --version' -f $edge)
              if ($LASTEXITCODE -ne 0) { throw 'EdgeDriver is not executable' }
              "ARQGEN_EDGEDRIVER=$edge" >> $env:GITHUB_ENV
              "ARQGEN_TAURI_DRIVER=$((Get-Command tauri-driver).Source)" >> $env:GITHUB_ENV
            } finally { Pop-Location }
          } catch {
            $message = ($_ | Out-String)
            $message = $message -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            if ($message.Length -gt 2500) { $message = $message.Substring(0, 2500) }
            Write-Host "::error title=WebView2 driver setup failed::$message"
            throw
          }
      - name: Smoke the REAL Tauri .exe in Edge WebView2
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/run-with-annotation.ps1'
          try {
            & $script -Name 'native-webview2-smoke' -TailLines 40 -Command 'npm run test:webview2 --prefix web'
            if ($LASTEXITCODE -ne 0) { throw 'Native WebView2 smoke FAILED' }
          } catch {
            $message = ($_ | Out-String)
            $message = $message -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            if ($message.Length -gt 2000) { $message = $message.Substring(0, 2000) }
            Write-Host "::error title=Native WebView2 smoke step failed::$message"
            throw
          }
      - name: Compile release Windows GUI executable (without installer)
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/run-with-annotation.ps1'
          & $script -Name 'windows-tauri-release-build' -TailLines 40 -Command 'npm run tauri --prefix web -- build --no-bundle'
          if ($LASTEXITCODE -ne 0) { throw 'Release Windows .exe build failed' }
          $app = Join-Path $env:GITHUB_WORKSPACE 'web/src-tauri/target/release/arqgen-desktop.exe'
          if (!(Test-Path $app)) { throw "Missing release executable: $app" }
          Get-FileHash $app -Algorithm SHA256 | Format-List
      - name: Create and verify ZIP containing the actual release .exe
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/run-with-annotation.ps1'
          & $script -Name 'windows-exe-zip' -Command 'node scripts/package-windows.mjs'
          if ($LASTEXITCODE -ne 0) { throw 'Release executable ZIP failed validation' }
      - name: Downloadable Windows EXE ZIP (unsigned prototype; WebView2 not included)
        uses: actions/upload-artifact@v4
        with:
          name: ARQ-GEN-Windows-x64-0.22.0
          path: artifacts/ARQ-GEN-Windows-x64-0.22.0.zip
          if-no-files-found: error
          retention-days: 7
      - name: Produce NSIS offlineInstaller candidate (build only; not installation QA)
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/run-with-annotation.ps1'
          & $script -Name 'windows-nsis-build' -TailLines 40 -Command 'npm run tauri --prefix web -- build --bundles nsis'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS build failed' }
          $installers = @(Get-ChildItem 'web/src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue)
          if ($installers.Count -lt 1) { throw 'NSIS installer not produced' }
          $installers | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 | Format-List }
          Write-Host 'Installer build passed; installation on a CLEAN OFFLINE machine is STILL PENDING.'
      - name: Diagnostic screenshot and Tauri lockfile (no unsigned installer uploaded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-webview2-diagnostics
          path: |
            web/webview2-qa/failure.png
            web/src-tauri/Cargo.lock
          if-no-files-found: ignore
          retention-days: 7
